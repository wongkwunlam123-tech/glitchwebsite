<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GLITCH Robotics is the VEX U robotics team at The Hong Kong Polytechnic University, building engineering talent, autonomous systems, and competitive innovation." />
    <meta name="theme-color" content="#0d111d" />
    <meta property="og:title" content="GLITCH Robotics | The Hong Kong Polytechnic University VEX U Team" />
    <meta property="og:description" content="Engineering excellence. Global ambition. GLITCH Robotics designs, programs, and competes with student-led robotics systems at PolyU." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/glitch-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>GLITCH Robotics | The Hong Kong Polytechnic University VEX U Team</title>
    <style>
      /* inline style ensures theme is applied before React loads */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light, html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark, html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }
    </style>
    <script>
      // set a default theme before React loads to avoid flash
      (function() {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        }

        if (isInIframe) {
          window.addEventListener('message', function(event) {
            if (event.data && typeof event.data.theme === 'string') {
              var theme = event.data.theme;
              if (theme === 'light' || theme === 'dark') {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          applyThemeToDOM('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
